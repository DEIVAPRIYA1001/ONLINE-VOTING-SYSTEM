<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        @keyframes sparkle {
            0% { text-shadow: 0 0 5px rgba(255, 204, 0, 0.8), 0 0 10px rgba(255, 204, 0, 0.8); }
            50% { text-shadow: 0 0 20px rgba(255, 204, 0, 1), 0 0 30px rgba(255, 204, 0, 1); }
            100% { text-shadow: 0 0 5px rgba(255, 204, 0, 0.8), 0 0 10px rgba(255, 204, 0, 0.8); }
        }

        body {
            font-family: Cambria, sans-serif;
            margin: 0;
            padding: 0;
            background: url('bgg.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 40%;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.3);
            text-align: center;
            color: white;
        }

        h2 {
            font-size: 32px;
            color: #ffcc00;
            animation: sparkle 1.5s infinite alternate;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        label {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            animation: sparkle 1.5s infinite alternate;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        input {
            width: 95%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        button {
            background: linear-gradient(45deg, #ff7e5f, #feb47b);
            color: white;
            padding: 12px;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            animation: sparkle 1.5s infinite alternate;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7), 0 0 20px rgba(255, 204, 0, 0.8);
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(45deg, #feb47b, #ff7e5f);
            box-shadow: 0 0 20px rgba(255, 204, 0, 1);
        }

        .container p {
            font-size: 18px;
            margin-top: 20px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Registration for Voting System</h2>
        <form id="registrationForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
           
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" required>
           
            <label for="voter-id">Voter ID:</label>
            <input type="text" id="voter-id" placeholder="Enter your Voter ID" required>
           
            <label for="aadhar">Aadhar Number:</label>
            <input type="text" id="aadhar" placeholder="Enter your Aadhar Number" required>
            <br>
            <button type="submit">Register to Vote</button>
        </form>
    </div>

    <script>
        const registeredVoters = JSON.parse(localStorage.getItem('registeredVoters')) || [];
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const voterId = document.getElementById('voter-id').value.trim();
            if (registeredVoters.includes(voterId)) {
                alert("This Voter ID has already selected a candidate. Please try with a different Voter ID.");
                return;
            }
            localStorage.setItem('registeredVoters', JSON.stringify([...registeredVoters, voterId]));
            window.location.href = "candidate.html";
        });
    </script>
</body>
</html>
