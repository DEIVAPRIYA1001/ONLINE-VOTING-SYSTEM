<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System</title>
    <style>
       
        body {
            font-family: Cambria, sans-serif;
            margin: 0;
            padding: 0;
            background: url('bgg.png') no-repeat center center fixed;
            background-size: cover;
            text-align: center;
            overflow-x: hidden;
            color: white;
        }

       
        .header-container {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .header-container img {
            width: 80px;
            height: auto;
            margin-right: 10px;
        }

       
        .attractive-text {
            font-size: 42px;
            font-weight: bold;
            text-transform: uppercase;
            background: linear-gradient(45deg, #FFD700, #FFA500, #FF4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 1.5s infinite alternate;
        }

       
        @keyframes glow {
            0% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.7); }
            100% { text-shadow: 0 0 25px rgba(255, 165, 0, 1); }
        }

 
        .nav-bar {
            display: flex;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 0;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .nav-bar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 20px;
            margin: 0 8px;
            border-radius: 5px;
            transition: 0.3s;
            background: linear-gradient(45deg, #ff5733, #ffcc00);
            box-shadow: 0 0 10px rgba(255, 87, 51, 0.7);
        }

        .nav-bar a:hover {
            transform: scale(1.1);
            background: linear-gradient(45deg, #ffcc00, #ff5733);
        }

       
        .welcome-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin: 20px auto;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            animation: borderGlow 1.5s infinite alternate;
        }

       
        @keyframes borderGlow {
            0% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.7); }
            100% { box-shadow: 0 0 25px rgba(255, 165, 0, 1); }
        }

    </style>
</head>
<body>
    
<BR>
    <div class="header-container">
        
      <a href="about.html">
    <img src="logo.png" alt="Logo">
</a>

        <h1 class="attractive-text">Online Voting System</h1>
    </div>
<BR>
    <div class="nav-bar">
        <a href="#">Home</a>
        <a href="instructions.html">Instructions</a>
        <a href="signup.html">SignUp</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact Us</a>
        
    </div>

    <div class="welcome-container">
<br>
        <p class="attractive-text">Welcome to Online Voting System</p>
        <p class="attractive-text">Vote for a Better Future!</p>
<br>
    </div>

</body>
</html>
